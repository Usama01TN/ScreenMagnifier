<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
    <!-- ScreenMagnifier icon: magnifier over colour pixels with the picked pixel outlined. Original artwork. -->
    <defs>
        <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#252E58"/>
            <stop offset="1" stop-color="#0D1124"/>
        </linearGradient>
        <radialGradient id="glow" cx="0.40" cy="0.38" r="0.6">
            <stop offset="0" stop-color="#4F6BFF" stop-opacity="0.38"/>
            <stop offset="1" stop-color="#4F6BFF" stop-opacity="0"/>
        </radialGradient>
        <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#8CBBFF"/>
            <stop offset="0.5" stop-color="#4F8BFF"/>
            <stop offset="1" stop-color="#8A5CFF"/>
        </linearGradient>
        <linearGradient id="handle" x1="0" y1="0" x2="1" y2="0">
            <stop offset="0" stop-color="#F2F4FA"/>
            <stop offset="1" stop-color="#97A3C2"/>
        </linearGradient>
        <linearGradient id="shine" x1="0" y1="0" x2="0.4" y2="1">
            <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.42"/>
            <stop offset="0.45" stop-color="#FFFFFF" stop-opacity="0"/>
        </linearGradient>
        <clipPath id="lens">
