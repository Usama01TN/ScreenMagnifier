# Builds Screen Magnifier (GUI + headless server) natively on 3 operating systems x 2 architectures and the Python
# package ScreenMagnifier (sdist + wheel), checks .github/FUNDING.yml, self-tests everything, and publishes a GitHub
# release with all of it - and the donation links of FUNDING.yml in its notes - when a tag v* is pushed:
#     git tag v1.0.0 && git push origin v1.0.0
name: Build and release

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version of a manual build (e.g. 1.2.3); empty = development build'
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.os }}-${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:  # explicit runner labels: -latest aliases move to new OS versions
          - { runner: ubuntu-24.04,     os: linux,   arch: x64 }
          - { runner: ubuntu-24.04-arm, os: linux,   arch: arm64 }
          - { runner: windows-2025,     os: windows, arch: x64 }
          - { runner: windows-11-arm,   os: windows, arch: arm64 }
          - { runner: macos-15-intel,   os: macos,   arch: x64 }
          - { runner: macos-15,         os: macos,   arch: arm64 }
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: .github/packaging/requirements-build.txt

      - name: Linux system libraries (Qt runtime, pynput build)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libegl1 libgl1 libxkbcommon0 libxkbcommon-x11-0 \
            libfontconfig1 libdbus-1-3 libxcb-cursor0 libxcb-icccm4 libxcb-keysyms1 libxcb-shape0 \
            libxcb-xinerama0 libxcb-randr0 libxcb-render-util0 libxcb-image0 build-essential

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r .github/packaging/requirements-build.txt

      - name: Version
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then v="${GITHUB_REF_NAME#v}"
          elif [[ -n "$INPUT_VERSION" ]]; then v="$INPUT_VERSION"
          else v="0.0.0-dev.${GITHUB_SHA::7}"; fi
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "Version: $v"

      - name: Build, self-test and package
        id: build
        run: python .github/packaging/build.py --version "${{ steps.version.outputs.version }}"

      - uses: actions/upload-artifact@v5
        with:
          name: ScreenMagnifier-${{ matrix.os }}-${{ matrix.arch }}
          path: ${{ steps.build.outputs.archive }}
          if-no-files-found: error
          retention-days: 14

  python-package:
    name: Python package (sdist + wheel)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Version from the tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          python - <<'PY'
          import os, re
          version = os.environ['GITHUB_REF_NAME'][1:]
          text = open('ScreenMagnifier/__init__.py').read()
          text = re.sub(r"__version__ = '[^']*'", "__version__ = '%s'" % version, text, count=1)
          open('ScreenMagnifier/__init__.py', 'w').write(text)
          print('version', version)
          PY

      - name: Check .github/FUNDING.yml (GitHub Sponsor button)
        run: |
          python -m pip install --upgrade pip pyyaml
          python .github/packaging/funding.py --check

      - name: Check the translations (complete, placeholders and icons kept)
        run: python .github/packaging/translations.py --check

      - name: Build and check
        run: |
          python -m pip install --upgrade build twine
          python -m build
          python -m twine check dist/*

      - name: Install the wheel in a fresh environment and self-test it
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3
          python -m venv /tmp/venv
          /tmp/venv/bin/pip install "$(ls dist/*.whl)[all]" pytest
          cp -r tests /tmp/tests
          cd /tmp
          QT_QPA_PLATFORM=offscreen /tmp/venv/bin/ScreenMagnifier --selftest
          /tmp/venv/bin/ScreenMagnifierServer --selftest
          QT_QPA_PLATFORM=offscreen /tmp/venv/bin/python -m pytest /tmp/tests -v

      - uses: actions/upload-artifact@v5
        with:
          name: python-package
          path: dist/*
          if-no-files-found: error
          retention-days: 14

  release:
    name: GitHub release
    needs: [build, python-package]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - name: Release notes - "Support the project" from .github/FUNDING.yml
        run: |
          python -m pip install pyyaml
          python .github/packaging/funding.py --notes "$RUNNER_TEMP/notes.md"

      - uses: actions/download-artifact@v5
        with:
          path: artifacts
          merge-multiple: true

      - name: Checksums
        run: |
          cd artifacts
          sha256sum ScreenMagnifier-* screenmagnifier-* > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          body_path: ${{ runner.temp }}/notes.md
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}

  pypi:
    # Optional: publish the Python package to PyPI on tags. Off until you enable it - one-time setup:
    #   1. pypi.org -> your account -> Publishing -> add a "trusted publisher": this repository, workflow
    #      build-release.yml, environment pypi (no password or token is stored anywhere).
    #   2. GitHub -> Settings -> Secrets and variables -> Actions -> Variables: PUBLISH_TO_PYPI = true
    name: Publish to PyPI
    needs: [build, python-package]
    if: startsWith(github.ref, 'refs/tags/v') && vars.PUBLISH_TO_PYPI == 'true'
    runs-on: ubuntu-24.04
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v5
        with:
          name: python-package
          path: dist

      - uses: pypa/gh-action-pypi-publish@release/v1
